openapi: 3.0.3
info:
  title: Inventory API
  version: "1.0"
  description: Stock and reservations. Admin HTTP endpoints; reservation/release happen over events.
servers:
  - url: /inventory/v1
paths:
  /stock:
    get:
      summary: List stock (Admin)
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StockDto' } } } } }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /stock/{productId}:
    get:
      summary: Get stock for a product (Admin)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: productId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StockDto' } } } }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    put:
      summary: Set quantity on hand (Admin)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: productId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdjustStockRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/StockDto' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    StockDto:
      type: object
      properties:
        productId: { type: string, format: uuid }
        quantityOnHand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    AdjustStockRequest:
      type: object
      required: [quantityOnHand]
      properties:
        quantityOnHand: { type: integer, minimum: 0 }
