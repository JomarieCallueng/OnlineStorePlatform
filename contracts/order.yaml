openapi: 3.0.3
info:
  title: Order API
  version: "1.0"
  description: Places orders and coordinates the saga (reserve -> charge -> confirm, with compensation).
servers:
  - url: /order/v1
paths:
  /orders:
    get:
      summary: List orders (own for customers, all for admin)
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderDto' } } } } }
        '401': { description: Unauthorized }
    post:
      summary: Place an order (starts the saga)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderRequest' } } }
      responses:
        '202': { description: Accepted (saga running), content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Product not found }
  /orders/{id}:
    get:
      summary: Get an order with status history
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } }
        '401': { description: Unauthorized }
        '404': { description: Not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    PlaceOrderRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItemRequest' } }
    OrderLineDto:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: double }
    OrderStatusHistoryDto:
      type: object
      properties:
        status: { type: string }
        note: { type: string }
        timestamp: { type: string, format: date-time }
    OrderDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { type: string, enum: [Pending, StockReserved, Confirmed, Compensating, Cancelled] }
        total: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLineDto' } }
        history: { type: array, items: { $ref: '#/components/schemas/OrderStatusHistoryDto' } }
