openapi: 3.0.3
info:
  title: Payment API
  version: "1.0"
  description: Charges and refunds (driven by events) plus a runtime failure switch for compensation demos.
servers:
  - url: /payment/v1
paths:
  /simulate-failure:
    get:
      summary: Read failure-switch state
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FaultStateDto' } } } }
        '401': { description: Unauthorized }
    post:
      summary: Toggle the simulate-payment-failure switch at runtime
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SimulateFailureRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FaultStateDto' } } } }
        '401': { description: Unauthorized }
  /charges/{orderId}:
    get:
      summary: List charges for an order (Admin)
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: orderId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChargeDto' } } } } }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    SimulateFailureRequest:
      type: object
      required: [enabled]
      properties: { enabled: { type: boolean } }
    FaultStateDto:
      type: object
      properties: { failPayments: { type: boolean } }
    ChargeDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { type: number, format: double }
        status: { type: string, enum: [Charged, Refunded, Failed] }
        createdAt: { type: string, format: date-time }
